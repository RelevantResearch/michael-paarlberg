<!-- Other Media Videos -->
<div class="container mt-4 pt-5">
  <div class="row">
    {% for video in site.data.media.videos %}
    <div class="col-md-6 mb-4">
      <div class="video-card">
        <h5 class="mb-3">{{ video.title }}</h5>
        {% if video.type == "local" %}
        <video
          controls
          width="100%"
          height="315"
          style="background-color: #000;"
        >
          <source src="{{ site.github.url }}/{{ video.src }}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        {% elsif video.type == "link" %}
        <a href="{{ video.src }}" target="_blank" rel="noopener" class="d-block position-relative">
          <img src="{{ video.poster }}" alt="{{ video.title | xml_escape }}" class="img-fluid" style="width: 100%;">
          <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4rem;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.7);">&#9654;</span>
        </a>
        {% else %}
        <div class="ratio ratio-16x9">
          <iframe
            scrolling="no"
            frameborder="0"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen"
            src="{{ video.src }}"
            width="100%"
            height="315"
          ></iframe>
        </div>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>

{% if site.data.media.featured_video %}
<!-- Featured video, centered below the grid -->
<div class="container mb-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="video-card">
        <h5 class="mb-3">{{ site.data.media.featured_video.title }}</h5>
        <div class="ratio ratio-16x9">
          <iframe
            frameborder="0"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            src="{{ site.data.media.featured_video.src }}"
            width="100%"
            height="315"
          ></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
{% endif %}
